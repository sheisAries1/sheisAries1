<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABC Doors</title>
  <meta name="description" content="A 3D animated ABC video for toddlers: open the colourful doors from A for Apple to L for Lion.">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="stage" aria-label="ABC Doors animation">

    </button>
  </main>
  <audio id="music" src="audio/soundtrack.m4a" preload="auto"></audio>
  <script type="module" src="js/main.js"></script>
